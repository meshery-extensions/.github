name: Apply support labels

on:
  push:
    branches: [master]
    paths:
      - "support-labels/manifest.yaml"
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPPORT_LABELS_TOKEN: ${{ secrets.SUPPORT_LABELS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip apply when support-labels token is unavailable
        if: ${{ env.SUPPORT_LABELS_TOKEN == '' }}
        run: echo "::notice::SUPPORT_LABELS_TOKEN is not configured; skipping support-label apply."

      - name: Install yq
        if: ${{ env.SUPPORT_LABELS_TOKEN != '' }}
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Apply support labels
        if: ${{ env.SUPPORT_LABELS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.SUPPORT_LABELS_TOKEN }}
        run: bash support-labels/scripts/apply-support-labels.sh support-labels/manifest.yaml
